# Render Blueprint — StockBot FastAPI 웹 서비스만 배포 (무료 Free 플랜).
# 텔레그램 봇(worker)은 여기 포함하지 않는다 — Render Free 는 별도 worker 무료 티어가 없어
# 기존 실행 환경(예: Railway)에서 그대로 유지한다.
#
# 프론트엔드(React/Vite)는 별도 서비스로 만들지 않고 같은 서비스에서 정적으로
# 서빙한다 (webapi/main.py 가 frontend/dist 를 마운트) — 새 무료 리소스를 늘리지
# 않기 위함. 이 빌드 환경엔 Node 가 없으므로 frontend/dist 는 미리 빌드해 커밋한
# 상태로 배포한다 (frontend/ 에서 `npm run build` 후 커밋).
services:
  - name: stockbot
    type: web
    runtime: python
    plan: free
    branch: refactor/modular-structure
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapi.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
